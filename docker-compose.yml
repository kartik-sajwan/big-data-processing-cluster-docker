services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    network_mode: host
    environment:
      - CLUSTER_NAME=test-cluster
      - HDFS_CONF_dfs_permissions=false
      - CORE_CONF_fs_defaultFS=hdfs://0.0.0.0:8020
      - HDFS_CONF_dfs_namenode_rpc-address=0.0.0.0:8020
      - HDFS_CONF_dfs_namenode_http-address=0.0.0.0:9870
      - HDFS_CONF_dfs_namenode_name_dir=/tmp/hadoop-root/dfs/name
    volumes:
      - ./hdfs/namenode:/tmp/hadoop-root/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    network_mode: host
    environment:
      - HDFS_CONF_dfs_permissions=false
      - CORE_CONF_fs_defaultFS=hdfs://0.0.0.0:8020
      - HDFS_CONF_dfs_datanode_hostname=0.0.0.0
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_datanode_data_dir=/hadoop/dfs/data
    volumes:
      - ./hdfs/datanode:/hadoop/dfs/data

  spark-master:
    image: apache/spark:v3.3.0
    container_name: spark-master
    command: >
      bash -c "
        /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      "
    environment:
      - SPARK_MODE=master
      - SPARK_NO_DAEMONIZE=true
      - SPARK_CONF_DIR=/opt/spark/conf
      - SPARK_EVENTLOG_ENABLED=true
      - SPARK_EVENTLOG_DIR=hdfs://0.0.0.0:8020/spark-events
    network_mode: host
    volumes:
      - ./conf:/opt/spark/conf
    depends_on:
      - namenode

  spark-worker-1:
    image: apache/spark:v3.3.0
    container_name: spark-worker-1
    network_mode: host
    user: root
    command: >
      bash -c "
        /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://0.0.0.0:7077
      "
    environment:
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=4g
      - SPARK_NO_DAEMONIZE=true
      - "SPARK_LOCAL_DIRS=/tmp/spark"
    volumes:
      - ./worker-local:/tmp/spark
      - ./conf:/opt/spark/conf
    depends_on:
      - spark-master
      
  spark-worker-2:
    image: apache/spark:v3.3.0
    container_name: spark-worker-2
    network_mode: host
    user: root
    command: >
      bash -c "
        /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://0.0.0.0:7077
      "
    environment:
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=4g
      - SPARK_NO_DAEMONIZE=true
      - "SPARK_LOCAL_DIRS=/tmp/spark"
    volumes:
      - ./worker-local:/tmp/spark
      - ./conf:/opt/spark/conf
    depends_on:
      - spark-master
      
  spark-history-server:
    image: apache/spark:v3.3.0
    container_name: spark-history
    network_mode: host
    command: >
      bash -c "
        /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer
      "
    environment:
      - SPARK_HISTORY_OPTS=-Dspark.history.fs.logDirectory=hdfs://0.0.0.0:8020/spark-events -Dspark.history.ui.port=18081
      - SPARK_NO_DAEMONIZE=true
    volumes:
      - ./conf:/opt/spark/conf
    depends_on:
      - spark-master

  postgres:
    image: postgres:14-alpine
    container_name: postgres
    network_mode: host
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aq_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  pgadmin:
      image: dpage/pgadmin4
      container_name: pgadmin
      network_mode: host
      environment:
        PGADMIN_DEFAULT_EMAIL: admin@admin.com
        PGADMIN_DEFAULT_PASSWORD: password
      ports:
        - "5050:80"
      depends_on:
        - postgres
